// ─── HOME ASSISTANT WS HOOK ──────────────────────────────────────────────────
function useHA(haConfig) {
  const [status,setStatus]=useState('disconnected'); // disconnected | connecting | connected | error
  const [entities,setEntities]=useState({});
  const [error,setError]=useState('');
  const wsRef=useRef(null);
  const msgIdRef=useRef(1);
  const handlersRef=useRef({});

  const connect = useCallback(()=>{
    if(!haConfig||!haConfig.url||!haConfig.token){
      setError('URL and token required');
      setStatus('error');
      return;
    }
    try {
      setStatus('connecting');
      setError('');
      const proto=haConfig.url.startsWith('https')?'wss':'ws';
      const host=haConfig.url.replace(/^https?:\/\//,'').replace(/\/+$/,'');
      const ws=new WebSocket(`${proto}://${host}/api/websocket`);
      wsRef.current=ws;
      ws.onopen=()=>{};
      ws.onerror=(e)=>{
        setStatus('error');
        setError('WebSocket connection failed');
      };
      ws.onclose=()=>{
        if(wsRef.current===ws) setStatus('disconnected');
      };
      ws.onmessage=(ev)=>{
        let msg;
        try { msg=JSON.parse(ev.data); } catch(_) { return; }
        if(msg.type==='auth_required'){
          ws.send(JSON.stringify({type:'auth',access_token:haConfig.token}));
        } else if(msg.type==='auth_ok'){
          setStatus('connected');
          // Fetch initial states
          const getId=msgIdRef.current++;
          handlersRef.current[getId]=(res)=>{
            if(res.success&&Array.isArray(res.result)){
              const map={};
              res.result.forEach(e=>{ map[e.entity_id]={state:e.state,attrs:e.attributes||{}}; });
              setEntities(map);
            }
          };
          ws.send(JSON.stringify({id:getId,type:'get_states'}));
          // Subscribe to state changes
          const subId=msgIdRef.current++;
          ws.send(JSON.stringify({id:subId,type:'subscribe_events',event_type:'state_changed'}));
        } else if(msg.type==='auth_invalid'){
          setStatus('error');
          setError('Invalid token');
          ws.close();
        } else if(msg.type==='result'&&handlersRef.current[msg.id]){
          handlersRef.current[msg.id](msg);
          delete handlersRef.current[msg.id];
        } else if(msg.type==='event'&&msg.event&&msg.event.event_type==='state_changed'){
          const ns=msg.event.data.new_state;
          if(ns){
            setEntities(prev=>({...prev,[ns.entity_id]:{state:ns.state,attrs:ns.attributes||{}}}));
          }
        }
      };
    } catch(e) {
      setStatus('error');
      setError(String(e&&e.message||e));
    }
  },[haConfig]);

  const disconnect = useCallback(()=>{
    if(wsRef.current){
      try { wsRef.current.close(); } catch(_) {}
      wsRef.current=null;
    }
    setStatus('disconnected');
    setEntities({});
  },[]);

  // Map entities to app data
  const haData = useMemo(()=>{
    if(status!=='connected') return null;
    const map=haConfig&&haConfig.map||DEFAULT_HA_MAP;
    const num=(k)=>{
      const e=entities[map[k]];
      if(!e) return null;
      const n=parseFloat(e.state);
      return isNaN(n)?null:n;
    };
    return {
      solar:num('solar'),
      battery:num('battery'),
      grid:num('grid'),
      home:num('home'),
      generator:num('generator'),
      temp:num('temp'),
      humidity:num('humidity'),
      waterFlow:num('waterFlow'),
      greywater:num('greywater'),
      rainwater:num('rainwater'),
      gridPrice:num('gridPrice'),
      gridFreq:num('gridFreq'),
      aqi:num('aqi'),
      pm25:num('pm25'),
      co2:num('co2'),
    };
  },[status,entities,haConfig]);

  useEffect(()=>()=>{ if(wsRef.current) try{wsRef.current.close()}catch(_){} },[]);

  return {status,error,entities,haData,connect,disconnect};
}

// ─── POWER FLOW CANVAS ────────────────────────────────────────────────────────
function PowerFlow({solar,battery,grid,home,batteryTrend}) {
  const cvs = useRef(null);
  const pts = useRef([]);
  const raf = useRef(null);
  const nodes={sun:{x:.15,y:.15,label:'Solar',val:`${solar.toFixed(1)}kW`,color:'#F59E0B'},
    bat:{x:.15,y:.8,label:'Battery',val:`${battery.toFixed(0)}%`,color:'#10B981'},
    grid:{x:.85,y:.15,label:'Grid',val:`${grid.toFixed(1)}kW`,color:'#6366F1'},
    home:{x:.5,y:.5,label:'Home',val:`${home.toFixed(1)}kW`,color:'#00D4A8'}};
  const flows=[
    {from:'sun',to:'home',kw:solar,color:'#F59E0B'},
    {from:batteryTrend==='charging'?'sun':'bat',to:batteryTrend==='charging'?'bat':'home',kw:.8,color:'#10B981'},
    {from:'grid',to:'home',kw:grid,color:'#6366F1'},
  ];
  useEffect(()=>{
    const cv=cvs.current; if(!cv) return;
    const ctx=cv.getContext('2d');
    let W,H;
    const resize=()=>{W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight};
    resize();
    const gp=k=>({x:nodes[k].x*W,y:nodes[k].y*H});
    let fr=0;
    const draw=()=>{
      ctx.clearRect(0,0,W,H);
      flows.forEach(f=>{
        if(f.kw<=.05)return;
        const a=gp(f.from),b=gp(f.to);
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
        ctx.strokeStyle=f.color+'18';ctx.lineWidth=1.5;ctx.stroke();
        if(fr%20===0&&f.kw>.05)pts.current.push({x:a.x,y:a.y,tx:b.x,ty:b.y,p:0,sp:.005+f.kw*.003,c:f.color,sz:1.5+f.kw*.3});
      });
      fr++;
      pts.current=pts.current.filter(p=>p.p<1);
      pts.current.forEach(p=>{
        p.p=Math.min(1,p.p+p.sp);p.x+=(p.tx-p.x)*p.sp*2.5;p.y+=(p.ty-p.y)*p.sp*2.5;
        const al=Math.sin(p.p*Math.PI);
        ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);
        ctx.fillStyle=p.c+Math.floor(al*255).toString(16).padStart(2,'0');ctx.fill();
      });
      Object.entries(nodes).forEach(([k,n])=>{
        const pos=gp(k);const r=k==='home'?34:26;
        ctx.beginPath();ctx.arc(pos.x,pos.y,r,0,Math.PI*2);
        ctx.fillStyle=n.color+'1A';ctx.fill();
        ctx.strokeStyle=n.color+'88';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle=n.color;ctx.textAlign='center';
        ctx.font=`500 ${k==='home'?12:10}px 'DM Sans',sans-serif`;
        ctx.fillText(n.label,pos.x,pos.y-4);
        ctx.font=`700 ${k==='home'?13:11}px 'Space Mono',monospace`;
        ctx.fillText(n.val,pos.x,pos.y+10);
      });
      raf.current=requestAnimationFrame(draw);
    };
    draw();
    window.addEventListener('resize',resize);
    return()=>{cancelAnimationFrame(raf.current);window.removeEventListener('resize',resize)};
  },[solar,battery,grid,home,batteryTrend]);
  return React.createElement('canvas',{ref:cvs,style:{width:'100%',height:'100%',display:'block'}});
}
