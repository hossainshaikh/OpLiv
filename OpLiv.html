      consumption:3+Math.random()*2,
      battery:40+i*1.2+(Math.random()-.5)*5,
    })),
    devices:[
      {id:1,room:'Majlis',name:'AC — Majlis',icon:'❄️',on:true,power:1800,setpoint:22,type:'ac'},
      {id:2,room:'Majlis',name:'Lights',icon:'💡',on:true,power:120,dim:80,type:'light'},

      {id:4,room:'Master Bedroom',name:'Lights',icon:'💡',on:false,power:60,dim:100,type:'light'},
      {id:5,room:'Kitchen',name:'Fridge',icon:'🧊',on:true,power:150,type:'switch',locked:true},
      {id:6,room:'Kitchen',name:'Dishwasher',icon:'🍽️',on:false,power:1800,type:'switch'},
      {id:7,room:'Garage',name:'EV Charger',icon:'⚡',on:true,power:7400,soc:64,type:'ev'},
      {id:8,room:'Garage',name:'Garage Door',icon:'🚗',on:false,type:'garage'},
      {id:9,room:'Pool Area',name:'Pool Pump',icon:'💧',on:false,power:1100,type:'switch'},
      {id:10,room:'Guest Bedroom',name:'AC — Guest',icon:'❄️',on:true,power:900,setpoint:24,type:'ac'},
    ],
    hitl:[{id:1,agent:'EOA',title:'Participate in DEWA Demand Response',reason:'Grid price rises to 38 fils/kWh 2pm–4pm. I can shift AC + EV to battery, saving an estimated AED 8.40.',impact:'Save AED 8.40 · Battery 85%→60% · Home stays cool',timeout:420}],
    agentLog:[
      {id:1,agent:'EOA',time:'14:32',action:'Switched to solar-primary mode',reason:'Solar exceeded home load by 1.8 kW — began battery charging',saving:0.42},
      {id:2,agent:'HAA',time:'14:18',action:'EV charging shifted to solar window',reason:'Solar forecast shows 5h window — moved schedule forward 90 min',saving:4.20},
      {id:3,agent:'HAA',time:'13:55',action:'Eco mode — Guest Bedroom AC +2°C',reason:'Room unoccupied for 28 minutes',saving:0.18},
    ],
    bills:[
      {month:'Apr 2025',kwh:1820,amount:512,savings:184},
      {month:'Mar 2025',kwh:2140,amount:643,savings:210},
      {month:'Feb 2025',kwh:1960,amount:571,savings:195},
      {month:'Jan 2025',kwh:2280,amount:698,savings:230},
    ],
  });
  const tick = useRef(0);
  useEffect(()=>{
    const iv = setInterval(()=>{
      tick.current++;
      const t=tick.current;
      const hr = new Date().getHours()+new Date().getMinutes()/60;
      const sBase = hr<6||hr>19?0:6*Math.sin(Math.PI*(hr-6)/13);
      const solar = Math.max(0,sBase+Math.sin(t*.1)*.3+.1);
      const home = 4.8+Math.sin(t*.07)*.6;
      const battery = Math.min(100,Math.max(10,d.battery+(solar>home?.05:-.03)));
      const grid = Math.max(0,home-solar-(battery>20?.5:0));
      setD(prev=>({...prev,solar,home,battery,grid,batteryTrend:solar>home?'charging':'discharging',
        hitl:prev.hitl.map(h=>({...h,timeout:Math.max(0,h.timeout-2)}))
      }));
    },2000);
    return ()=>clearInterval(iv);
  },[]);
  const toggleDev = useCallback(id=>{
    setD(prev=>({...prev,devices:prev.devices.map(dv=>dv.id===id&&!dv.locked?{...dv,on:!dv.on}:dv)}));
  },[]);
  const resolveHitl = useCallback((id,dec)=>{
    setD(prev=>({...prev,
      hitl:prev.hitl.filter(h=>h.id!==id),
      agentLog:[{id:Date.now(),agent:'EOA',time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
        action:'DR Participation '+(dec==='approve'?'approved':'rejected'),
        reason:dec==='approve'?'Owner approved via in-app':'Owner rejected',saving:dec==='approve'?8.40:0},...prev.agentLog]
    }));
  },[]);
  return {d, toggleDev, resolveHitl};
}

// ─── POWER FLOW CANVAS ────────────────────────────────────────────────────────
function PowerFlow({solar,battery,grid,home,batteryTrend}) {
  const cvs = useRef(null);
  const pts = useRef([]);
  const raf = useRef(null);
  const nodes={sun:{x:.15,y:.15,label:'Solar',val:`${solar.toFixed(1)}kW`,color:'#F59E0B'},
    bat:{x:.15,y:.8,label:'Battery',val:`${battery.toFixed(0)}%`,color:'#10B981'},
    grid:{x:.85,y:.15,label:'Grid',val:`${grid.toFixed(1)}kW`,color:'#6366F1'},
    home:{x:.5,y:.5,label:'Home',val:`${home.toFixed(1)}kW`,color:'#00D4A8'}};
  const flows=[
    {from:'sun',to:'home',kw:solar,color:'#F59E0B'},
    {from:batteryTrend==='charging'?'sun':'bat',to:batteryTrend==='charging'?'bat':'home',kw:.8,color:'#10B981'},
    {from:'grid',to:'home',kw:grid,color:'#6366F1'},
  ];
  useEffect(()=>{
    const cv=cvs.current; if(!cv) return;
    const ctx=cv.getContext('2d');
    let W,H;
    const resize=()=>{W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight};
    resize();
    const gp=k=>({x:nodes[k].x*W,y:nodes[k].y*H});
    let fr=0;
    const draw=()=>{
      ctx.clearRect(0,0,W,H);
      flows.forEach(f=>{
        if(f.kw<=.05)return;
        const a=gp(f.from),b=gp(f.to);
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
        ctx.strokeStyle=f.color+'18';ctx.lineWidth=1.5;ctx.stroke();
        if(fr%20===0&&f.kw>.05)pts.current.push({x:a.x,y:a.y,tx:b.x,ty:b.y,p:0,sp:.005+f.kw*.003,c:f.color,sz:1.5+f.kw*.3});
      });
      fr++;
      pts.current=pts.current.filter(p=>p.p<1);
      pts.current.forEach(p=>{
        p.p=Math.min(1,p.p+p.sp);p.x+=(p.tx-p.x)*p.sp*2.5;p.y+=(p.ty-p.y)*p.sp*2.5;
        const al=Math.sin(p.p*Math.PI);
        ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);
        ctx.fillStyle=p.c+Math.floor(al*255).toString(16).padStart(2,'0');ctx.fill();
      });
      Object.entries(nodes).forEach(([k,n])=>{
        const pos=gp(k);const r=k==='home'?34:26;
        ctx.beginPath();ctx.arc(pos.x,pos.y,r,0,Math.PI*2);
        ctx.fillStyle=n.color+'1A';ctx.fill();
        ctx.strokeStyle=n.color+'88';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle=n.color;ctx.textAlign='center';
        ctx.font=`500 ${k==='home'?12:10}px 'DM Sans',sans-serif`;
        ctx.fillText(n.label,pos.x,pos.y-4);
        ctx.font=`700 ${k==='home'?13:11}px 'Space Mono',monospace`;
        ctx.fillText(n.val,pos.x,pos.y+10);
      });
      raf.current=requestAnimationFrame(draw);
    };
    draw();
    window.addEventListener('resize',resize);
    return()=>{cancelAnimationFrame(raf.current);window.removeEventListener('resize',resize)};
  },[solar,battery,grid,home,batteryTrend]);
  return React.createElement('canvas',{ref:cvs,style:{width:'100%',height:'100%',display:'block'}});
}
